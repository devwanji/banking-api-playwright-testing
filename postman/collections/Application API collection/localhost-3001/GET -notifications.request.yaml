$kind: http-request
name: GET /notifications
url: "{{baseUrl}}/notifications"
method: GET
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("Notifications request returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Notifications response is valid JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("Notifications response contains data", function () {
          const response = pm.response.json();
          pm.expect(response).to.exist;
      });

      pm.test("Response time is below 3000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
    language: text/javascript
examples: ./.resources/GET -notifications.resources/examples
order: 2000
